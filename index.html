<script>
"use strict";
const { useState, useEffect, useRef, useCallback, useReducer } = React;
const html = htm.bind(React.createElement);

/* ------------------------------------------------------------------ conexión (protocolo v1) */
const SENSIBLES = /porton|portón|portero|cerradura|puerta/i;           // piden un "¿seguro?" extra en la app
const CON_TIEMPO = /riego|calefon|calefón|estufa|bomba|termo/i;      // muestran el campo de minutos
const guardado = (k) => { try { return localStorage.getItem(k); } catch { return null; } };
const guardar = (k, v) => { try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch {} };

const SALUDO = { de: "jarvis", t: "Hola. Tocá 🎤 y hablame, o escribime. Órdenes de la casa: “abrí el riego 10 minutos”, “cómo está el tanque”. Para otros temas necesito el modelo de lenguaje (lo habilita Pablo en el servidor)." };
/* A dónde conectarse: vacío = la misma dirección desde la que se abrió la app (el propio casa-servidor).
   Si la app se abre desde otro sitio (p. ej. Vercel), se indica la dirección de la casa: 100.x.y.z:8884 o casa.xxx.ts.net:8884. */
function destino(dir) {
  const t = (dir || "").trim();
  if (!t) return { ws: (location.protocol === "https:" ? "wss://" : "ws://") + location.host + location.pathname.replace(/[^/]*$/, "") + "ws", http: "media/audio", nombre: location.host };
  const u = new URL(/^[a-z]+:\/\//i.test(t) ? t : "https://" + t);
  return { ws: (u.protocol === "http:" ? "ws://" : "wss://") + u.host + "/ws", http: u.origin + "/media/audio", nombre: u.host };
}

const inicial = { conexion: "desconectado", error: null, modulos: {}, eventos: [], confirmaciones: [], ordenes: {}, yo: null, chat: [SALUDO], pend: {} };

function reductor(s, a) {
  switch (a.t) {
    case "conexion": return { ...s, conexion: a.valor, error: a.error ?? (a.valor === "conectado" ? null : s.error) };
    case "limpiar": return { ...inicial, conexion: s.conexion };
    case "yo": return { ...s, yo: a.valor };
    case "chat": return { ...s, chat: [...s.chat, ...a.items].slice(-60), pend: a.pend ? { ...s.pend, ...a.pend } : s.pend };
    case "pend_fin": { const { [a.id]: _, ...resto } = s.pend; return { ...s, pend: resto }; }
    case "msg": {
      const m = a.m, [, mod, ...resto] = m.topic.split("/"), k = resto.join("/");
      const actual = s.modulos[mod] || {};
      let nuevo = { ...actual };
      if (k === "respuesta") {                 // lo que contesta Jarvis a mi audio o a mi pregunta
        if (mod !== s.yo || m.retenido) return s;
        const p = s.pend[m.id], items = [];
        if (p && p.tipo === "audio") items.push({ de: "yo", t: m.texto ? "🎤 " + m.texto : "🎤 (no se entendió)" });
        items.push({ de: "jarvis", t: m.respuesta || "…", voz: true });
        const { [m.id]: _, ...resto } = s.pend;
        return { ...s, chat: [...s.chat, ...items].slice(-60), pend: resto };
      }
      if (k === "online") nuevo.online = !!m.valor;
      else if (k === "desc") nuevo.desc = m;
      else if (k === "estado") {
        // un estado SIN cmd_id que llega en vivo y cambia el valor = alguien lo tocó a mano
        const cambio = JSON.stringify(actual.valor) !== JSON.stringify(m.valor);
        nuevo = { ...nuevo, valor: m.valor, ts: m.ts, manual: !m.retenido && !m.cmd_id && actual.valor !== undefined && cambio };
      }
      const modulos = { ...s.modulos, [mod]: nuevo };
      let ordenes = s.ordenes, eventos = s.eventos;
      if (k === "estado" && m.cmd_id && ordenes[m.cmd_id]) ordenes = { ...ordenes, [m.cmd_id]: { ...ordenes[m.cmd_id], estado: "cumplida" } };
      if (k === "evento" && !m.retenido) {
        eventos = [{ modulo: mod, ts: m.ts, tipo: m.tipo || "evento", datos: m.datos }, ...eventos].slice(0, 100);
        if (m.tipo === "cmd_sin_respuesta" && ordenes[m.cmd_id]) ordenes = { ...ordenes, [m.cmd_id]: { ...ordenes[m.cmd_id], estado: "sin_respuesta" } };
      }
      return { ...s, modulos, ordenes, eventos };
    }
    case "confirmar": return { ...s, confirmaciones: [...s.confirmaciones.filter((c) => c.id !== a.m.id), a.m] };
    case "resuelta": return { ...s, confirmaciones: s.confirmaciones.filter((c) => c.id !== a.id) };
    case "orden": return { ...s, ordenes: { ...s.ordenes, [a.id]: { ...(s.ordenes[a.id] || {}), ...a.datos } } };
    default: return s;
  }
}

function useCasa() {
  const [s, d] = useReducer(reductor, inicial);
  const ref = useRef({ ws: null, cred: null, intento: 0, timer: null, ping: null, cerrado: true });

  const enviar = useCallback((obj) => {
    const ws = ref.current.ws;
    if (!ws || ws.readyState !== 1) return false;
    ws.send(JSON.stringify({ v: 1, ...obj }));
    return true;
  }, []);

  const abrir = useCallback(() => {
    const r = ref.current;
    clearTimeout(r.timer);
    d({ t: "conexion", valor: "conectando" });
    let dest; try { dest = destino(r.cred.dir); } catch { r.cerrado = true; return d({ t: "conexion", valor: "auth", error: "La dirección de la casa no es válida." }); }
    const ws = new WebSocket(dest.ws);
    r.ws = ws;
    ws.onopen = () => enviar({ t: "hola", usuario: r.cred.usuario, clave: r.cred.clave });
    ws.onmessage = (ev) => {
      let m; try { m = JSON.parse(ev.data); } catch { return; }
      if (m.t === "ok") {
        r.intento = 0; r.visto = true;
        d({ t: "conexion", valor: "conectado" });
        enviar({ t: "sub", topics: ["casa/#"] });
        clearInterval(r.ping);
        r.ping = setInterval(() => enviar({ t: "ping" }), Math.max(5, (m.keepalive || 30) / 2) * 1000);
      } else if (m.t === "msg") d({ t: "msg", m });
      else if (m.t === "confirmar") d({ t: "confirmar", m });
      else if (m.t === "pendiente" && m.id) d({ t: "orden", id: m.id, datos: { estado: "esperando_persona" } });
      else if (m.t === "error") {
        if (m.codigo === "auth") { r.cerrado = true; d({ t: "conexion", valor: "auth", error: "Usuario o clave incorrectos, o el usuario está bloqueado." }); }
        else if (m.id) {
          d({ t: "orden", id: m.id, datos: { estado: "error", detalle: texto_error(m) } });
          d({ t: "resuelta", id: m.id });
        } else d({ t: "conexion", valor: "conectado", error: texto_error(m) });
      }
    };
    ws.onclose = () => {
      clearInterval(r.ping);
      if (r.cerrado) return;
      r.intento += 1;
      d({ t: "conexion", valor: "desconectado", error: !r.visto && r.intento >= 3 ? `No llego a la casa (${dest.nombre}). ¿Está encendido el servidor? ¿El teléfono tiene Tailscale y confía en la CA de la casa? ¿Este sitio está permitido en el servidor (--origen)?` : undefined });
      r.timer = setTimeout(abrir, Math.min(30000, 1000 * 2 ** Math.min(r.intento, 5)));   // 2, 4, 8... hasta 30 s
    };
  }, [enviar]);

  const entrar = useCallback((usuario, clave, dir) => {
    const r = ref.current;
    r.cred = { usuario, clave, dir }; r.cerrado = false; r.intento = 0; r.visto = false;
    d({ t: "yo", valor: usuario.replace(/^[a-z]-/, "") });
    if (r.ws) { r.ws.onclose = null; r.ws.close(); }
    abrir();
  }, [abrir]);

  const salir = useCallback(() => {
    const r = ref.current;
    r.cerrado = true; clearTimeout(r.timer); clearInterval(r.ping);
    if (r.ws) r.ws.close();
    d({ t: "limpiar" }); d({ t: "conexion", valor: "desconectado" });
  }, []);

  // al volver a la app (el teléfono la suspendió) se reconecta enseguida
  useEffect(() => {
    const f = () => { const r = ref.current; if (!document.hidden && !r.cerrado && (!r.ws || r.ws.readyState > 1)) { r.intento = 0; abrir(); } };
    document.addEventListener("visibilitychange", f);
    return () => document.removeEventListener("visibilitychange", f);
  }, [abrir]);

  const ordenar = useCallback((modulo, accion, params) => {
    const id = "a-" + Array.from(crypto.getRandomValues(new Uint8Array(6)), (b) => b.toString(16).padStart(2, "0")).join("");
    d({ t: "orden", id, datos: { modulo, accion, estado: "enviada" } });
    if (!enviar({ t: "pub", topic: `casa/${modulo}/cmd`, id, accion, ...(params ? { params } : {}) }))
      d({ t: "orden", id, datos: { estado: "error", detalle: "Sin conexión con la casa." } });
    setTimeout(() => d({ t: "orden", id, datos: { _vence: true } }), 20000);
    return id;
  }, [enviar]);

  const responder = useCallback((id, acepta) => { enviar({ t: acepta ? "confirmo" : "rechazo", id }); d({ t: "resuelta", id }); }, [enviar]);
  const cred = useCallback(() => ref.current.cred, []);
  const preguntar = useCallback((texto) => {
    const id = "q-" + Array.from(crypto.getRandomValues(new Uint8Array(5)), (b) => b.toString(16).padStart(2, "0")).join("");
    const yo = ref.current.cred.usuario.replace(/^[a-z]-/, "");
    if (!enviar({ t: "pub", topic: `casa/${yo}/pregunta`, id, texto })) return null;
    d({ t: "chat", items: [{ de: "yo", t: texto }], pend: { [id]: { tipo: "texto" } } });
    setTimeout(() => d({ t: "pend_fin", id }), 25000);
    return id;
  }, [enviar]);
  return { s, entrar, salir, ordenar, responder, cred, preguntar, dispatch: d };
}

/* ------------------------------------------------------------------ micrófono (botón de hablar) y voz de Jarvis */
function usarMicrofono(cred, dispatch) {
  const [grabando, setGrabando] = useState(false);
  const g = useRef(null);
  const aviso = (t) => dispatch({ t: "chat", items: [{ de: "jarvis", t }] });
  const parar = useCallback(async (enviar = true) => {
    const x = g.current; if (!x) return;
    g.current = null; setGrabando(false); clearTimeout(x.tope);
    x.proc.disconnect(); x.src.disconnect(); x.stream.getTracks().forEach((t) => t.stop());
    const entrada = x.ctx.sampleRate; await x.ctx.close();
    if (!enviar) return;
    const largo = x.trozos.reduce((n, t) => n + t.length, 0), f = new Float32Array(largo);
    let o = 0; for (const t of x.trozos) { f.set(t, o); o += t.length; }
    const n = Math.floor(largo * 16000 / entrada), pcm = new Int16Array(n);    // a 16 kHz, 16 bits, mono
    for (let i = 0; i < n; i++) { const p = i * entrada / 16000, j = Math.floor(p), fr = p - j, v = f[j] * (1 - fr) + (f[j + 1] ?? f[j]) * fr; pcm[i] = Math.max(-1, Math.min(1, v)) * 32767; }
    if (n < 16000 * 0.4) return aviso("Fue muy corto, probá de nuevo.");
    const c = cred();
    try {
      let url; try { url = destino(c.dir).http; } catch { return aviso("La dirección de la casa no es válida."); }
      const r = await fetch(url, { method: "POST", body: pcm.buffer,
        headers: { Authorization: "Basic " + btoa(unescape(encodeURIComponent(c.usuario + ":" + c.clave))), "Content-Type": "audio/L16;rate=16000" } });
      const j = await r.json().catch(() => ({}));
      if (r.status === 202) dispatch({ t: "chat", items: [], pend: { [j.id]: { tipo: "audio" } } });
      else aviso({ 401: "El servidor no aceptó mi usuario.", 403: "Este usuario no puede mandar audio.", 413: "Es demasiado largo (máximo 30 segundos).",
        507: "El servidor se quedó sin espacio para audio.", 404: "El servidor no tiene el audio habilitado." }[r.status] || "No pude enviar el audio.");
    } catch { aviso("No pude enviar el audio: sin conexión."); }
  }, [cred, dispatch]);
  const empezar = useCallback(async () => {
    if (!navigator.mediaDevices || !window.isSecureContext) return aviso("El micrófono necesita HTTPS con certificado de confianza (instalá la CA de la casa en el teléfono).");
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: { channelCount: 1, echoCancellation: true, noiseSuppression: true } });
      const ctx = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: 16000 });
      const src = ctx.createMediaStreamSource(stream), proc = ctx.createScriptProcessor(4096, 1, 1), trozos = [];
      proc.onaudioprocess = (e) => trozos.push(new Float32Array(e.inputBuffer.getChannelData(0)));
      src.connect(proc); proc.connect(ctx.destination);
      g.current = { stream, ctx, src, proc, trozos, tope: setTimeout(() => parar(true), 20000) };
      setGrabando(true);
    } catch (e) { aviso(e && e.name === "NotAllowedError" ? "Sin permiso para usar el micrófono." : "No pude abrir el micrófono."); }
  }, [parar]);
  return { grabando, alternar: () => (g.current ? parar(true) : empezar()), cancelar: () => parar(false) };
}

let vozElegida;
function hablar(texto) {                      // voz sintética del propio dispositivo (una sola, sencilla); si no hay local, no habla
  const ss = window.speechSynthesis; if (!ss || !texto) return;
  if (vozElegida === undefined) vozElegida = ss.getVoices().find((v) => v.localService && /^es/i.test(v.lang)) || null;
  if (!vozElegida) { vozElegida = undefined; return; }
  ss.cancel(); const u = new SpeechSynthesisUtterance(texto); u.voice = vozElegida; u.lang = vozElegida.lang; ss.speak(u);
}
if (window.speechSynthesis) window.speechSynthesis.onvoiceschanged = () => { vozElegida = undefined; };

function texto_error(m) {
  const base = { permiso: "No tenés permiso para eso.", politica: m.detalle || "La política de la casa no lo permite.",
    offline: "El módulo está desconectado; la orden no se mandó.", frecuencia: "Demasiados mensajes.", formato: m.detalle || "Mensaje inválido." };
  return base[m.codigo] || m.codigo || "Error";
}

/* ------------------------------------------------------------------ utilidades */
function hace(ts, ahora) {
  if (!ts) return "sin datos";
  const s = Math.max(0, Math.round(ahora / 1000 - ts));
  if (s < 5) return "recién"; if (s < 60) return `hace ${s} s`;
  if (s < 3600) return `hace ${Math.floor(s / 60)} min`; if (s < 86400) return `hace ${Math.floor(s / 3600)} h`;
  return `hace ${Math.floor(s / 86400)} d`;
}
function useAhora() { const [n, setN] = useState(Date.now()); useEffect(() => { const i = setInterval(() => setN(Date.now()), 5000); return () => clearInterval(i); }, []); return n; }
const sinAcentos = (t) => t.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "");

/* ------------------------------------------------------------------ pantallas */
function Login({ onEntrar, error, conectando }) {
  const [usuario, setUsuario] = useState(guardado("casa.usuario") || "");
  const [clave, setClave] = useState("");
  const [dir, setDir] = useState(guardado("casa.dir") || "");
  const [recordar, setRecordar] = useState(!!guardado("casa.clave"));
  const enviar = (e) => {
    e.preventDefault();
    guardar("casa.usuario", usuario || null);
    guardar("casa.clave", recordar ? clave : null);
    guardar("casa.dir", dir.trim() || null);
    onEntrar(usuario.trim(), clave, dir.trim());
  };
  return html`<form class="login" onSubmit=${enviar}>
    <h1>🏠 Casa</h1>
    <label>Usuario<input value=${usuario} onInput=${(e) => setUsuario(e.target.value)} autocomplete="username" autocapitalize="none" required placeholder="p-pablo-celu"/></label>
    <label>Clave<input type="password" value=${clave} onInput=${(e) => setClave(e.target.value)} autocomplete="current-password" required/></label>
    <label>Dirección de la casa (opcional)<input value=${dir} onInput=${(e) => setDir(e.target.value)} autocapitalize="none" inputmode="url" placeholder="vacío = esta misma dirección"/></label>
    <div class="nota">Si abriste la app desde otro sitio (por ejemplo Vercel), poné acá la dirección del servidor de la casa, como 100.64.0.1:8884.</div>
    <label class="chk"><input type="checkbox" checked=${recordar} onChange=${(e) => setRecordar(e.target.checked)}/> Recordar en este teléfono</label>
    ${recordar && html`<div class="nota">La clave queda guardada en este dispositivo. Si lo perdés, bloqueá el usuario desde el servidor.</div>`}
    ${error && html`<div class="banda error" role="alert">${error}</div>`}
    <button class="pri" disabled=${conectando}>${conectando ? "Conectando…" : "Entrar"}</button>
  </form>`;
}

function Valor({ valor }) {
  if (valor === undefined) return html`<span class="pie">sin datos todavía</span>`;
  if (valor === null || typeof valor !== "object") return html`<div class="valores"><span class="chip"><b>${String(valor)}</b></span></div>`;
  return html`<div class="valores">${Object.entries(valor).map(([k, v]) => {
    if (typeof v === "number" && /nivel|humedad|bateria|batería/i.test(k) && v >= 0 && v <= 100)
      return html`<div key=${k} style=${{ width: "100%" }}><div class="pie">${k}: ${v}%</div><div class="barra" role="meter" aria-valuenow=${v} aria-valuemin="0" aria-valuemax="100" aria-label=${k}><i style=${{ width: v + "%" }}></i></div></div>`;
    return html`<span class="chip" key=${k}>${k}: <b>${typeof v === "object" ? JSON.stringify(v) : String(v)}</b></span>`;
  })}</div>`;
}

function Tarjeta({ nombre, m, ordenes, onOrdenar, ahora }) {
  const [minutos, setMinutos] = useState(10);
  const acciones = (m.desc && m.desc.acciones) || [];
  const tipo = (m.desc && m.desc.tipo) || "";
  const conTiempo = CON_TIEMPO.test(nombre + " " + tipo);
  const ultima = Object.values(ordenes).filter((o) => o.modulo === nombre).slice(-1)[0];
  const lanzar = (accion) => {
    if (SENSIBLES.test(nombre + " " + tipo) && !window.confirm(`¿Seguro que querés "${accion}" ${nombre}?`)) return;
    const abre = /abrir|encender/.test(accion);
    onOrdenar(nombre, accion, conTiempo && abre ? { minutos: Math.max(1, Number(minutos) || 10) } : undefined);
  };
  return html`<article class=${"tarjeta" + (m.online ? "" : " fuera")} aria-label=${nombre}>
    <h2><span class=${"punto " + (m.online ? "on" : m.online === false ? "off" : "")} aria-hidden="true"></span>${nombre}
      <span class="tipo">${m.online ? tipo : "desconectado"}</span></h2>
    <${Valor} valor=${m.valor}/>
    ${acciones.length > 0 && html`<div class="acciones">
      ${conTiempo && acciones.some((a) => /abrir|encender/.test(a)) && html`<label class="chk" style=${{ gap: "4px" }}><input type="number" min="1" max="600" value=${minutos} onInput=${(e) => setMinutos(e.target.value)} aria-label="minutos"/> min</label>`}
      ${acciones.map((a) => html`<button key=${a} class=${/abrir|encender/.test(a) ? "pri" : ""} disabled=${!m.online} onClick=${() => lanzar(a)}>${a}</button>`)}
    </div>`}
    ${ultima && html`<div class=${"pie " + (ultima.estado === "cumplida" ? "exito" : ultima.estado === "error" || ultima.estado === "sin_respuesta" ? "fallo" : "")} role="status">
      ${ultima.accion}: ${{ enviada: "enviada…", cumplida: "cumplida ✓", sin_respuesta: "el módulo no confirmó", esperando_persona: "esperando confirmación", error: ultima.detalle || "error" }[ultima.estado] || ultima.estado}</div>`}
    <div class="pie">${m.manual && html`<span class="mano">Cambió a mano · </span>`}${hace(m.ts, ahora)}</div>
  </article>`;
}

function Casa({ s, onOrdenar }) {
  const ahora = useAhora();
  const nombres = Object.keys(s.modulos).sort();
  if (!nombres.length) return html`<div class="vacio">${s.conexion === "conectado" ? "Todavía no hay módulos conectados." : "Conectando con la casa…"}</div>`;
  return html`<div class="grilla">${nombres.map((n) => html`<${Tarjeta} key=${n} nombre=${n} m=${s.modulos[n]} ordenes=${s.ordenes} onOrdenar=${onOrdenar} ahora=${ahora}/>`)}</div>`;
}

function Avisos({ s }) {
  const caidos = Object.entries(s.modulos).filter(([, m]) => m.online === false);
  const nombre = { movimiento: "Movimiento", cmd_sin_respuesta: "Una orden no fue confirmada por el módulo" };
  return html`<div class="lista">
    ${caidos.map(([n]) => html`<div key=${n} class="banda error">⚠️ ${n} está desconectado</div>`)}
    ${s.eventos.length === 0 && caidos.length === 0 && html`<div class="vacio">Sin avisos.</div>`}
    ${s.eventos.map((e, i) => html`<div class="evento" key=${i}><b>${e.modulo}</b> · ${nombre[e.tipo] || e.tipo}<div class="pie">${new Date(e.ts * 1000).toLocaleString("es-AR")}</div></div>`)}
  </div>`;
}

/* Jarvis. Las órdenes de la casa las entiende este intérprete local (instantáneo y sin internet). Lo que no entiende
   (y todo el audio) va al servidor: el puente de voz lo transcribe y Jarvis contesta; para temas generales usa Gemini. */
const SINONIMOS = { abrir: ["abri", "abre", "abrir", "abrime"], cerrar: ["cerra", "cerrar", "cierra"], encender: ["encende", "encender", "prende", "prender", "enciende"],
  apagar: ["apaga", "apagar"] };
const raiz = (p) => (p.endsWith("ces") ? p.slice(0, -3) + "z" : p.length > 3 && p.endsWith("s") ? p.slice(0, -1) : p);
function interpretar(texto, modulos) {
  const t = sinAcentos(texto), palabras = new Set(t.split(/[^a-z0-9]+/).filter(Boolean).map(raiz));
  const modulo = Object.keys(modulos).find((n) => palabras.has(raiz(sinAcentos(n))) || (modulos[n].desc && modulos[n].desc.tipo && palabras.has(raiz(sinAcentos(modulos[n].desc.tipo)))));
  if (/(como esta|como andan?|estado|nivel|cuanto|que hay)/.test(t) || (!modulo && /\btodo\b|\bcasa\b/.test(t))) return { tipo: "estado", modulo };
  const accion = Object.entries(SINONIMOS).find(([, ws]) => ws.some((w) => palabras.has(raiz(sinAcentos(w))) || palabras.has(sinAcentos(w))));
  if (modulo && accion) {
    let minutos; const mm = t.match(/(\d+)\s*(minutos?|min\b|horas?|h\b)?/);
    if (/media hora/.test(t)) minutos = 30; else if (mm) minutos = Number(mm[1]) * (mm[2] && mm[2][0] === "h" ? 60 : 1); else if (/\buna hora\b/.test(t)) minutos = 60;
    return { tipo: "orden", modulo, accion: accion[0], minutos };
  }
  return { tipo: "nada" };
}
function Jarvis({ s, onOrdenar, dispatch, preguntar, mic, vozActiva, setVozActiva }) {
  const [txt, setTxt] = useState(""); const fin = useRef(null);
  useEffect(() => { fin.current && fin.current.scrollIntoView({ block: "end" }); }, [s.chat]);
  const decir = (de, t) => dispatch({ t: "chat", items: [{ de, t }] });
  const enviar = (e) => {
    e.preventDefault(); const q = txt.trim(); if (!q) return; setTxt("");
    const r = interpretar(q, s.modulos);
    if (r.tipo === "nada") { if (!preguntar(q)) { decir("yo", q); decir("jarvis", "No hay conexión con la casa."); } return; }
    decir("yo", q);
    if (r.tipo === "estado") {
      const lista = r.modulo ? [r.modulo] : Object.keys(s.modulos);
      return decir("jarvis", lista.length ? lista.map((n) => `${n}: ${s.modulos[n].online === false ? "desconectado" : JSON.stringify(s.modulos[n].valor ?? "sin datos")}`).join("\n") : "No hay módulos conectados.");
    }
    const m = s.modulos[r.modulo];
    if (SENSIBLES.test(r.modulo)) return decir("jarvis", `${r.modulo} no se maneja por texto ni por voz: usá el botón en la pestaña Casa.`);
    if (!(m.desc && m.desc.acciones || []).includes(r.accion)) return decir("jarvis", `${r.modulo} no entiende "${r.accion}". Acepta: ${((m.desc && m.desc.acciones) || []).join(", ") || "ninguna orden"}.`);
    onOrdenar(r.modulo, r.accion, r.minutos && /abrir|encender/.test(r.accion) ? { minutos: r.minutos } : undefined);
    decir("jarvis", `Listo, mandé "${r.accion}" a ${r.modulo}${r.minutos ? ` por ${r.minutos} min` : ""}. Mirá el resultado en la tarjeta.`);
  };
  const esperando = Object.keys(s.pend).length > 0;
  return html`<div><div class="chat" aria-live="polite">${s.chat.map((m, i) => html`<div key=${i} class=${"burbuja " + m.de}>${m.t}</div>`)}
      ${esperando && html`<div class="burbuja jarvis" aria-label="Jarvis está pensando">…</div>`}<div ref=${fin}></div></div>
    <div class="entrada">
      <button type="button" class=${"mic" + (mic.grabando ? " grabando" : "")} onClick=${mic.alternar} aria-pressed=${mic.grabando} aria-label=${mic.grabando ? "Dejar de grabar y enviar" : "Hablar con Jarvis"}>${mic.grabando ? "⏹" : "🎤"}</button>
      <form onSubmit=${enviar} style=${{ display: "flex", gap: "8px", flex: 1 }}><input value=${txt} onInput=${(e) => setTxt(e.target.value)} placeholder=${mic.grabando ? "Escuchando… tocá ⏹ para enviar" : "Escribile a Jarvis…"} aria-label="Mensaje para Jarvis"/><button class="pri">Enviar</button></form>
    </div>
    <label class="chk nota" style=${{ gap: "6px" }}><input type="checkbox" checked=${vozActiva} onChange=${(e) => setVozActiva(e.target.checked)}/> Que Jarvis responda en voz alta (voz del teléfono)</label></div>`;
}

function Confirmaciones({ lista, onResponder }) {
  return html`${lista.map((c) => html`<div class="banda" key=${c.id} role="alertdialog" aria-label="Confirmación necesaria">
    <div><b>¿Confirmás?</b> ${c.accion} ${c.topic.split("/")[1]}${c.params && c.params.minutos ? ` por ${c.params.minutos} min` : ""}
      <div class="pie">Pedido por ${c.de} (${c.origen})</div></div>
    <div class="fila"><button class="pri" onClick=${() => onResponder(c.id, true)}>Confirmar</button><button class="mal" onClick=${() => onResponder(c.id, false)}>Rechazar</button></div>
  </div>`)}`;
}

function App() {
  const { s, entrar, salir, ordenar, responder, cred, preguntar, dispatch } = useCasa();
  const mic = usarMicrofono(cred, dispatch);
  const [vozActiva, setVozActivaX] = useState(guardado("casa.voz") !== "no");
  const setVozActiva = (v) => { setVozActivaX(v); guardar("casa.voz", v ? null : "no"); if (!v && window.speechSynthesis) window.speechSynthesis.cancel(); };
  const ultimo = s.chat[s.chat.length - 1];
  useEffect(() => { if (vozActiva && ultimo && ultimo.voz) hablar(ultimo.t); }, [s.chat.length]);
  const [tab, setTab] = useState("casa");
  const autoEntro = useRef(false);
  useEffect(() => {   // entrada automática si se eligió "recordar"
    if (autoEntro.current) return; autoEntro.current = true;
    const u = guardado("casa.usuario"), c = guardado("casa.clave"); if (u && c) entrar(u, c, guardado("casa.dir") || "");
  }, [entrar]);
  const dentro = s.conexion === "conectado" || (s.conexion === "conectando" && Object.keys(s.modulos).length) || s.conexion === "desconectado" && Object.keys(s.modulos).length;
  if (!dentro) return html`<${Login} onEntrar=${entrar} error=${s.error} conectando=${s.conexion === "conectando"}/>`;
  const caidos = Object.values(s.modulos).filter((m) => m.online === false).length;
  return html`<div class="wrap">
    <header><h1>🏠 Casa</h1>
      <span class="estado" role="status"><span class=${"punto " + (s.conexion === "conectado" ? "on" : "off")}></span>${{ conectado: "conectado", conectando: "conectando…", desconectado: "sin conexión" }[s.conexion] || s.conexion}</span>
      <button onClick=${salir} aria-label="Salir">Salir</button></header>
    ${s.error && html`<div class="banda error" role="alert">${s.error}</div>`}
    <${Confirmaciones} lista=${s.confirmaciones} onResponder=${responder}/>
    <main>${tab === "casa" ? html`<${Casa} s=${s} onOrdenar=${ordenar}/>` : tab === "avisos" ? html`<${Avisos} s=${s}/>` : html`<${Jarvis} s=${s} onOrdenar=${ordenar} dispatch=${dispatch} preguntar=${preguntar} mic=${mic} vozActiva=${vozActiva} setVozActiva=${setVozActiva}/>`}</main>
    <nav aria-label="Secciones">
      ${[["casa", "🏠 Casa"], ["avisos", "🔔 Avisos"], ["jarvis", "💬 Jarvis"]].map(([k, t]) => html`<button key=${k} aria-current=${tab === k ? "page" : undefined} onClick=${() => setTab(k)}>${t}${k === "avisos" && caidos > 0 ? html`<span class="insignia">${caidos}</span>` : ""}</button>`)}
    </nav></div>`;
}

ReactDOM.createRoot(document.getElementById("raiz")).render(html`<${App}/>`);
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
</script>
</body>
</html>
